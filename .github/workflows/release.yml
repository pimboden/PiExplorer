name: Release

# Push a tag like v1.0.0 to build PiExplorer.exe and publish it as a GitHub release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish PiExplorer.csproj -c Release -o publish

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" publish/PiExplorer.exe --title "PiExplorer ${{ github.ref_name }}" --generate-notes
